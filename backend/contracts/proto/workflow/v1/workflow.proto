syntax="proto3";
package saya.workflow.v1;
option go_package="saya/contracts/workflow/v1;workflowv1";
service Survey {rpc Interview(Empty)returns(Questionnaire);rpc Latest(Owner)returns(Operation);rpc Current(Empty)returns(Questionnaire);rpc Submit(Submission)returns(Operation);rpc Input(OwnedID)returns(Submission);}
message AppealQuery {string scope=1; string user_id=2; bool moderator=3;}
message AppealItem {string id=1; string description=2; string state=3; bool reported=4; bool card_ready=5;}
message AppealList {repeated AppealItem items=1; bool checkout_available=2;}
message AppealChange {string action=1;string id=2;string user_id=3;string description=4;bool consent=5;bool moderator=6;}
message CheckoutRequest {string appeal_id=1;int32 amount=2;}
message CheckoutReply {string url=1;}
message PaymentResult {map<string,string> fields=1;}
message CardNotification {string xml=1;}
message PaymentAck {string xml=1;}
service Assessment {rpc BindPayoutCard(OwnedID)returns(CheckoutReply);rpc PayoutCallback(CardNotification)returns(Empty);rpc CardCallback(CardNotification)returns(Empty);rpc Checkout(CheckoutRequest)returns(CheckoutReply);rpc PaymentCallback(PaymentResult)returns(PaymentAck);rpc Appeals(AppealQuery)returns(AppealList);rpc MutateAppeal(AppealChange)returns(Empty);rpc History(HistoryRequest)returns(WeeklyHistory);rpc SetDevice(DeviceRequest)returns(Empty);rpc Get(OwnedID)returns(Result);rpc Input(OwnedID)returns(Submission);rpc Complete(Completion)returns(Empty);}
service InterviewAssistant {rpc Focus(FocusRequest)returns(FocusResult);}
message FocusRequest{string topic=1;map<string,int32> ratings=2;bool consent=3;}
message FocusResult{string focus=1;}
message Empty{}
message Owner{string user_id=1;}
message Questionnaire{string id=1;int32 version=2;repeated Question questions=3;string disclaimer=4;}
message Question{string id=1;string label=2;map<string,string> variants=3;}
message Submission{string user_id=1;string questionnaire_id=2;int32 version=3;map<string,bool> answers=4;bool consent=5;bool external_llm_consent=6;string idempotency_key=7;map<string,string> responses=8;map<string,int32> ratings=9;string summary=10;repeated string needs=11;map<string,string> question_focus=12;}
message OwnedID{string id=1;string user_id=2;}
message Operation{string id=1;string status=2;}
message Result{string id=1;string status=2;bool immediate_threat_reported=3;repeated string recommendations=4;string disclaimer=5;string provider=6;map<string,int32> ratings=7;optional int32 percentage=8;string summary=9;repeated string directions=10;int32 version=11;}
message Completion{string id=1;string user_id=2;repeated string recommendations=3;string provider=4;bool failed=5;}

message HistoryRequest{string user_id=1;string before_id=2;}
message DeviceRequest{string user_id=1;string token=2;bool enabled=3;}
message WeeklyEntry{string id=1;int64 completed_at=2;int32 version=3;optional int32 percentage=4;map<string,int32> ratings=5;repeated string directions=6;}
message WeeklyHistory{repeated WeeklyEntry entries=1;int64 next_due=2;bool reminder_due=3;string next_cursor=4;bool push_available=5;}
